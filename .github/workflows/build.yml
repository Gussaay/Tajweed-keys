name: Build web and Android APK

# On every push to main:
#   1. builds the Android APK and publishes it as a GitHub Release, so there is
#      always a permanent download link:
#        https://github.com/Gussaay/Tajweed-keys/releases/latest/download/tajweed-keys.apk
#   2. deploys the web app to Firebase Hosting (project tajweed-24716):
#        https://tajweed-24716.web.app
#      Firebase Hosting refuses .apk files on the free Spark plan, so the APK
#      stays on GitHub Releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm test
      - name: Build web assets and copy them into android/
        run: npm run build && npx cap sync android
      - name: Version from the run number
        run: |
          sed -i -e "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -e "s/versionName \".*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../tajweed-keys.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tajweed-keys-apk
          path: tajweed-keys.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مفاتيح التجويد 1.0.${{ github.run_number }}
          body: Android APK built from ${{ github.sha }}. Download tajweed-keys.apk and open it on the phone to install.
          files: tajweed-keys.apk
          make_latest: true


  web:
    name: Web (Firebase Hosting)
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAJWEED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Secret FIREBASE_SERVICE_ACCOUNT_TAJWEED: the JSON key of a service
      # account of project tajweed-24716 (Firebase console > Project settings >
      # Service accounts > Generate new private key), or the one that
      # `firebase init hosting:github` creates.
      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAJWEED }}
          projectId: tajweed-24716
          channelId: live
      - name: Secret missing
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT_TAJWEED secret to deploy to https://tajweed-24716.web.app"
